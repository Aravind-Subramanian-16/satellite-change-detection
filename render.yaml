services:
  - type: web
    name: satellite-change-detection
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: ANALYSIS_DB_PATH
        value: /app/data/analysis_history.sqlite3
      - key: MAX_AOI_KM
        value: "10"
      - key: DEFAULT_WINDOW_DAYS
        value: "30"
      - key: CLOUD_WARN_PERCENT
        value: "30"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      # Optional: mount a valid 33,268,410-byte model at /app/model.onnx or
      # point this at a path provided by a persistent disk/secret mount.
      - key: MODEL_ONNX_PATH
        value: /app/model.onnx
      - key: ENABLE_LEARNED_MODEL
        value: "0"
